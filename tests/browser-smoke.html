<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CharityWatch browser smoke test</title></head>
<body>
<h1>CharityWatch browser smoke test</h1>
<output id="result" data-test-result="RUNNING">RUNNING</output>
<iframe id="site" src="../index.html#charity/ew/802052" title="CharityWatch application" style="width:1100px;height:800px"></iframe>
<script>
const output=document.getElementById('result');
const frame=document.getElementById('site');
const started=Date.now();
let stage=0;
const failures=[];
function finish(ok,message){
 output.dataset.testResult=ok?'PASS':'FAIL';
 output.textContent=(ok?'PASS: ':'FAIL: ')+message;
 clearInterval(tick);
}
const tick=setInterval(()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  if(Date.now()-started>45000){
   const diagnostic='stage '+stage+'; title: '+(doc.getElementById('profileTitle')?.textContent||'missing')+
    '; profile: '+(doc.getElementById('profileBody')?.textContent||'missing').slice(0,180)+
    '; results: '+(doc.getElementById('results')?.textContent||'missing').slice(0,160);
   return finish(false,'Timed out: '+diagnostic);
  }
  if(stage===0){
   const metadata=doc.getElementById('profileMeta')?.textContent||'';
   const pay=doc.getElementById('verifiedCEO')?.textContent||'';
   const salary=doc.getElementById('salary-report');
   if(!metadata.includes('802052')||!pay.includes('165,695')||!salary?.querySelector('tbody tr'))return;
   stage=1;
   const search=doc.getElementById('q'),form=doc.getElementById('searchForm');
   if(!search||!form)return finish(false,'Search controls missing');
   search.value='802052';
   form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
   return;
  }
  if(stage===1){
   const card=doc.querySelector('#resultCards button[data-profile="802052"]');
   const results=doc.getElementById('results')?.textContent||'';
   if(!card||!results.includes('BBC CHILDREN IN NEED')||!results.includes('165,695'))return;
   return finish(true,'BBC profile, sourced CEO remuneration, salary bands and registration search');
  }
 }catch(err){finish(false,String(err&&err.message||err));}
},300);
</script>
</body></html>
