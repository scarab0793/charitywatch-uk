name: Publish verified institutional grant totals
on:
  push:
    paths:
      - '.github/workflows/build-grant-makers.yml'
      - 'scripts/build_grant_makers.py'
  workflow_dispatch:
concurrency:
  group: charitywatch-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  grant-makers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce grant-maker totals from verified Part B statements
        run: python scripts/build_grant_makers.py
      - name: Commit validated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A -- data/grant-makers-ew.json data/grant-makers-meta-ew.json
            if git diff --cached --quiet; then
              echo "Grant totals unchanged"
              exit 0
            fi
            git commit -m "Publish sourced grant-making totals"
            if git push origin HEAD:main; then
              echo "Verified grant totals published"
              exit 0
            fi
            echo "Remote main advanced; retrying publication ($attempt/3)"
          done
          echo "Could not publish grant totals after 3 attempts" >&2
          exit 1
