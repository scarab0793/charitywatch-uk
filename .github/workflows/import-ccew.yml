name: Import official England and Wales charity register
on:
  push:
    paths:
      - '.github/workflows/import-ccew.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Direct HTTPS URL of the official Charity Commission main charity TXT ZIP (not the landing page)"
        required: false
        type: string
        default: "https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity.zip"
permissions:
  contents: write
concurrency:
  group: official-ccew-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official source URL
        env:
          ARCHIVE_URL: ${{ inputs.archive_url || 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity.zip' }}
        run: |
          python - <<'PY'
          import os,urllib.parse
          u=urllib.parse.urlsplit(os.environ["ARCHIVE_URL"])
          allowed={"register-of-charities.charitycommission.gov.uk","ccewuksprdoneregsadata1.blob.core.windows.net"}
          assert u.scheme=="https" and u.hostname in allowed and not u.username and not u.password, "Only an approved Charity Commission download host is permitted"
          assert u.path.endswith("/publicextract.charity.zip"), "Expected the official charity ZIP path"
          print("Approved official source host:",u.hostname)
          PY
      - name: Download official archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url || 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity.zip' }}
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 "$ARCHIVE_URL" -o /tmp/charities.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile("/tmp/charities.zip"),"URL did not return a ZIP archive"
          PY
      - name: Download annual return history
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity_annual_return_history.zip' -o /tmp/history.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/history.zip'), 'Invalid annual history ZIP'
          PY
      - name: Download official detailed annual return Part A
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity_annual_return_parta.zip' -o /tmp/parta.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/parta.zip'), 'Invalid detailed annual return ZIP'
          PY
      - name: Download official detailed annual return Part B
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity_annual_return_partb.zip' -o /tmp/partb.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/partb.zip'), 'Invalid detailed Part B annual return ZIP'
          PY
      - name: Import and validate
        run: |
          python scripts/import_ccew.py --zip /tmp/charities.zip --output data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/manifest-ew.json").read_text())
          assert m["count"]>100000
          assert m["shards"] and m["number_shards"]
          print("Verified official charity count:",m["count"])
          PY
      - name: Join annual returns and validate coverage
        run: |
          python scripts/enrich_ccew_finances.py --charity-zip /tmp/charities.zip --history-zip /tmp/history.zip --output data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          assert m['financial_records'] >= 150000, 'Financial coverage below safe floor'
          assert m['financial_records'] <= m['count'], 'Unexpected financial coverage'
          print('Verified financial coverage:',m['financial_records'], '/',m['count'])
          PY
      - name: Join government funding and salary band records
        run: |
          python scripts/build_salary_shards.py --zip /tmp/parta.zip --output data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          assert m['annual_return_part_a_records'] > 10000
          print('Verified detailed return records:', m['annual_return_part_a_records'])
          PY
      - name: Join official expenditure categories and reserves
        run: |
          python scripts/enrich_ccew_part_b.py --zip /tmp/partb.zip --output data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          assert 10000 < m['annual_return_part_b_records'] <= m['count']
          print('Verified detailed expenditure records:',m['annual_return_part_b_records'])
          PY
      - name: Generate institutional grant-making totals
        run: |
          python scripts/build_grant_makers.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/grant-makers-ew.json').read_text())
          assert d['record_count']>=200
          print('Verified grant-making charities:',d['record_count'])
          PY
      - name: Build indexed name-word search
        run: |
          python scripts/build_word_index.py --data data --region ew
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          assert m['word_index_records'] >= 100000
          assert m['word_shards']
          print('Word index records:',m['word_index_records'])
          PY
      - name: Commit verified directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ew data/words/ew data/pay/ew data/grant-makers-ew.json data/grant-makers-meta-ew.json data/manifest-ew.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CCEW charity directory and annual finances"
            git push
          fi
