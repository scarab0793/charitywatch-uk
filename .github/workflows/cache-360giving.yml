name: Cache 360Giving published grant awards
on:
  schedule:
    - cron: '22 5 * * 2'
  # Rebuild the public cache when the collector or its selection rules change.
  # Changes made by the workflow to data/360giving do not retrigger it.
  push:
    branches: [main]
    paths:
      - 'scripts/cache_360giving.py'
      - 'scripts/select_360giving_orgs.py'
      - 'scripts/validate_360giving_api_page.py'
      - 'scripts/validate_360giving_sample.py'
      - '.github/workflows/cache-360giving.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: charitywatch-data-writes
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test page layout and cache consistency before collecting
        run: |
          python scripts/test_360giving_collection_config.py
          python scripts/test_360giving_api_pages.py
          python scripts/test_360giving_sample.py
          python scripts/test_360giving_pages.py
          python scripts/test_360giving_cache.py
      - name: Retrieve selected organisation grant awards
        run: python scripts/cache_360giving.py
      - name: Validate all successfully refreshed award snapshots
        run: python scripts/verify_360giving_cache.py
      - name: Summarise cache health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('data/360giving/manifest.json').read_text())
          label=m['status']
          message=f"360Giving refresh: {label} ({m['updated_directions']} of {len(m['organisations'])} directions refreshed)"
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### '+message+'\n')
              if label!='ok':
                  out.write('Some sources were unavailable; existing cache files were retained.\n')
          PY
      - name: Commit checked public grant snapshots safely
        run: |
          set -e
          # The next scheduled run should not fail just because the main
          # branch changed between checkout and publication.
          mkdir -p /tmp/charitywatch-grants
          cp -a data/360giving/. /tmp/charitywatch-grants/
          # A queued older run must not publish data collected under obsolete
          # selection/validation code after the default branch has changed.
          collector_fingerprint=$(sha256sum scripts/cache_360giving.py scripts/select_360giving_orgs.py scripts/validate_360giving_api_page.py scripts/validate_360giving_sample.py .github/workflows/cache-360giving.yml | sha256sum | cut -d' ' -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            latest_fingerprint=$(sha256sum scripts/cache_360giving.py scripts/select_360giving_orgs.py scripts/validate_360giving_api_page.py scripts/validate_360giving_sample.py .github/workflows/cache-360giving.yml | sha256sum | cut -d' ' -f1)
            if [ "$latest_fingerprint" != "$collector_fingerprint" ]; then
              echo "Collector or validation code changed after checkout; skipping stale snapshot publication."
              echo "Skipped stale snapshot publication after collector code changed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            mkdir -p data/360giving
            # Mirror the validated snapshot exactly, including deletions of
            # outdated pages. Plain cp -a would retain obsolete JSON pages.
            rsync -a --delete /tmp/charitywatch-grants/ data/360giving/
            # Validate again after reset/mirror, immediately before commit.
            python scripts/verify_360giving_cache.py
            git add -A data/360giving
            if git diff --cached --quiet; then
              echo "360Giving snapshots are already up to date."
              exit 0
            fi
            git commit -m "Refresh public 360Giving award snapshots"
            if git push origin HEAD:main; then
              echo "Published 360Giving snapshots successfully."
              exit 0
            fi
            echo "Main branch moved during publication; retrying against latest main (attempt $attempt)."
            sleep 3
          done
          echo "::error::Could not publish the refreshed snapshots after three attempts."
          exit 1
