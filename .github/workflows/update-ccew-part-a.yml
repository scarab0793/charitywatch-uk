name: Update CCEW detailed annual returns (Part A)
on:
  push:
    paths:
      - '.github/workflows/update-ccew-part-a.yml'
      - 'scripts/enrich_ccew_part_a.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-ccew-import
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official annual return Part A
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 \
            'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity_annual_return_parta.zip' \
            -o /tmp/parta.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/parta.zip'), 'Official Part A ZIP download invalid'
          PY
      - name: Enrich current registry with details
        run: |
          python scripts/enrich_ccew_part_a.py --zip /tmp/parta.zip --output data
          python - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('data/manifest-ew.json').read_text())
          count=m['annual_return_part_a_records']
          assert 10000<count<=m['count']
          assert m['annual_return_part_a_aligned_periods']>1000, 'Too few comparable reporting periods'
          print('Detailed Part A coverage:',count,'/',m['count'])
          print('Matching financial periods:',m['annual_return_part_a_aligned_periods'])
          with open(Path.cwd() / 'summary.md','w') as f:
              f.write(f"### CCEW detailed Part A import\n\nLinked charities: **{count:,}** of **{m['count']:,}**\n")
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ew data/manifest-ew.json
          if ! git diff --cached --quiet; then
            git commit -m "Enrich charities with verified annual Part A disclosures"
            git push
          fi
