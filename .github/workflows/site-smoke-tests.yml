name: CharityWatch website smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/smoke_test.mjs'
      - 'scripts/verify_published_data.py'
      - 'scripts/verify_search_indexes.py'
      - 'scripts/test_search_indexes.py'
      - 'scripts/verify_refresh_regression.py'
      - 'scripts/test_refresh_regression.py'
      - 'scripts/check_ccew_archives.py'
      - 'scripts/test_ccew_archives.py'
      - 'scripts/select_360giving_orgs.py'
      - 'scripts/test_360giving_selection.py'
      - 'scripts/cache_360giving.py'
      - 'tests/browser-smoke.html'
      - 'data/manifest-ew.json'
      - 'data/ew/**'
      - 'data/words/ew/**'
      - 'data/grant-makers-ew.json'
      - 'data/grant-makers-meta-ew.json'
      - 'data/pay/ew/**'
      - 'data/verified-ceo-pay.json'
      - '.github/workflows/site-smoke-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/smoke_test.mjs'
      - 'scripts/verify_published_data.py'
      - 'scripts/verify_search_indexes.py'
      - 'scripts/test_search_indexes.py'
      - 'scripts/verify_refresh_regression.py'
      - 'scripts/test_refresh_regression.py'
      - 'scripts/check_ccew_archives.py'
      - 'scripts/test_ccew_archives.py'
      - 'scripts/select_360giving_orgs.py'
      - 'scripts/test_360giving_selection.py'
      - 'scripts/cache_360giving.py'
      - 'tests/browser-smoke.html'
      - 'data/manifest-ew.json'
      - 'data/ew/**'
      - 'data/words/ew/**'
      - 'data/grant-makers-ew.json'
      - 'data/grant-makers-meta-ew.json'
      - 'data/pay/ew/**'
      - 'data/verified-ceo-pay.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charitywatch-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Website and chart data integrity tests
        run: node scripts/smoke_test.mjs
      - name: Salary shard consistency
        run: python3 scripts/verify_salary_shards.py
      - name: Verified CEO disclosure source checks
        run: python3 scripts/validate_ceo_pay.py
      - name: Validate all published official datasets
        run: python3 scripts/verify_published_data.py
      - name: Check full charity name and registration search indexes
        run: python3 scripts/verify_search_indexes.py
      - name: Test search index consistency with synthetic fixtures
        run: python3 scripts/test_search_indexes.py
      - name: Test coverage-regression publication safeguard
        run: python3 scripts/test_refresh_regression.py
      - name: Test CCEW ZIP validation with synthetic source files
        run: python3 scripts/test_ccew_archives.py
      - name: Test capped 360Giving charity selection
        run: python3 scripts/test_360giving_selection.py
      - name: Check import and validation Python syntax
        run: |
          python3 -m py_compile scripts/import_ccew.py scripts/enrich_ccew_finances.py scripts/build_salary_shards.py scripts/enrich_ccew_part_b.py scripts/build_grant_makers.py scripts/build_word_index.py scripts/verify_published_data.py scripts/verify_search_indexes.py scripts/test_search_indexes.py scripts/verify_refresh_regression.py scripts/test_refresh_regression.py scripts/check_ccew_archives.py scripts/test_ccew_archives.py scripts/select_360giving_orgs.py scripts/cache_360giving.py scripts/test_360giving_selection.py
      - name: Open real charity profile and search in headless Chrome
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/charitywatch-http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          timeout 100 "$CHROME" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=65000 --dump-dom http://127.0.0.1:8765/tests/browser-smoke.html > /tmp/charitywatch-browser.html 2>/tmp/charitywatch-chrome.log
          if ! grep -q 'data-test-result="PASS"' /tmp/charitywatch-browser.html; then
            grep -o 'data-test-result="[^"]*"[^<]*>[^<]*' /tmp/charitywatch-browser.html || true
            tail -n 30 /tmp/charitywatch-chrome.log || true
            exit 1
          fi
          echo 'PASS: browser loaded live local app data and verified profile, salary bands and search'
      - name: Publish verification summary
        if: success()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('data/manifest-ew.json').read_text(encoding='utf-8'))
          grants = json.loads(Path('data/grant-makers-meta-ew.json').read_text(encoding='utf-8'))
          fields = [
              ('Registered charities', manifest['count']),
              ('Charities with financial histories', manifest['financial_records']),
              ('Part A salary disclosure records', manifest['annual_return_part_a_records']),
              ('Part B expenditure records', manifest['annual_return_part_b_records']),
              ('Name word-index records', manifest['word_index_records']),
              ('Institutional grant-making organisations', grants['record_count']),
          ]
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write('## CharityWatch tests passed\n\n')
              out.write('Verified: JavaScript, browser profile/search, salary disclosures, search indexes, data consistency, and import fixtures.\n\n')
              out.write('| Published dataset | Records |\n|---|---:|\n')
              for name, value in fields:
                  out.write(f'| {name} | {value:,} |\n')
              out.write('\nThese are published data counts, not counts of charities independently audited by this workflow.\n')
          PY
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: charitywatch-browser-test-diagnostics
          path: |
            /tmp/charitywatch-browser.html
            /tmp/charitywatch-chrome.log
            /tmp/charitywatch-http.log
          if-no-files-found: ignore
