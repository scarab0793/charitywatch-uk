name: CharityWatch website smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/smoke_test.mjs'
      - 'data/verified-ceo-pay.json'
      - '.github/workflows/site-smoke-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/smoke_test.mjs'
      - 'data/verified-ceo-pay.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Website and chart data integrity tests
        run: node scripts/smoke_test.mjs
      - name: Salary shard consistency
        run: python3 scripts/verify_salary_shards.py
      - name: Verified CEO disclosure source checks
        run: python3 scripts/validate_ceo_pay.py
