name: Validate 360Giving cache

on:
  push:
    paths:
      - 'scripts/verify_360giving_cache.py'
      - 'scripts/test_360giving_cache.py'
      - 'scripts/cache_360giving.py'
      - 'scripts/validate_360giving_api_page.py'
      - 'scripts/validate_360giving_sample.py'
      - 'scripts/test_360giving_sample.py'
      - 'scripts/test_360giving_api_pages.py'
      - 'scripts/test_360giving_collection_config.py'
      - 'scripts/test_360giving_pages.py'
      - 'assets/grant-links.js'
      - 'data/verified-ceo-pay.json'
      - 'scripts/test_verified_ceo_pay.py'
      - 'index.html'
      - 'data/360giving/**'
      - '.github/workflows/verify-360giving-cache.yml'
  pull_request:
    paths:
      - 'scripts/verify_360giving_cache.py'
      - 'scripts/test_360giving_cache.py'
      - 'scripts/cache_360giving.py'
      - 'scripts/validate_360giving_api_page.py'
      - 'scripts/validate_360giving_sample.py'
      - 'scripts/test_360giving_sample.py'
      - 'scripts/test_360giving_api_pages.py'
      - 'scripts/test_360giving_collection_config.py'
      - 'scripts/test_360giving_pages.py'
      - 'data/360giving/**'
      - '.github/workflows/verify-360giving-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check grant explorer JavaScript syntax
        run: node --check assets/grant-links.js
      - name: Validate sourced CEO pay catalogue
        run: python3 scripts/test_verified_ceo_pay.py
      - name: Check collector limits
        run: python3 scripts/test_360giving_collection_config.py
      - name: Test API pagination response validation
        run: python3 scripts/test_360giving_api_pages.py
      - name: Test safe cache replacement
        run: python3 scripts/test_360giving_sample.py
      - name: Run offline consistency tests
        run: python3 scripts/test_360giving_cache.py
      - name: Test paged snapshots and migration compatibility
        run: python3 scripts/test_360giving_pages.py
      - name: Validate published snapshots if present
        shell: bash
        run: |
          if [ -f data/360giving/manifest.json ]; then
            python3 scripts/verify_360giving_cache.py --directory data/360giving
          else
            echo "No published manifest present; offline test suite passed."
          fi
