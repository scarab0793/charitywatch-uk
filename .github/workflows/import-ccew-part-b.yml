name: Import CCEW expenditure and reserves (Part B)
on:
  push:
    paths:
      - '.github/workflows/import-ccew-part-b.yml'
      - 'scripts/enrich_ccew_part_b.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: charitywatch-data-writes
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official annual return Part B
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 500000000 \
            'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity_annual_return_partb.zip' \
            -o /tmp/partb.zip
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/partb.zip')
          PY
      - name: Join official expenditure details
        run: |
          python scripts/enrich_ccew_part_b.py --zip /tmp/partb.zip --output data
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          count=m.get('annual_return_part_b_records',0)
          assert 10000<count<=m['count']
          print('Matched charity Part B records:',count)
          print('Matched financial reporting periods:',m.get('annual_return_part_b_aligned_periods',0))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/manifest-ew.json').read_text())
          assert m['annual_return_part_b_aligned_periods'] > 1000, 'Too few same-period matches'
          print('Data integrity checks passed.')
          PY
      - name: Rebuild linked grant totals and verify published metadata
        run: |
          python scripts/build_grant_makers.py
          python scripts/verify_published_data.py
      - name: Commit validated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A -- data/ew data/manifest-ew.json data/grant-makers-ew.json data/grant-makers-meta-ew.json
            if git diff --cached --quiet; then
              echo "No Part B data changes to publish"
              exit 0
            fi
            git commit -m "Publish verified CCEW expenditure, reserves and linked grants"
            if git push origin HEAD:main; then
              echo "Validated Part B data and grant totals published"
              exit 0
            fi
            echo "Remote main advanced; retrying publication ($attempt/3)"
          done
          echo "Could not publish validated Part B data after 3 attempts" >&2
          exit 1
